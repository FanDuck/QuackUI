  <rect x="492" y="96" width="78" height="28" rx="8" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-opacity="0.45"/>
  <text x="531" y="115" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" fill="#fbbf24">v2.3.5</text>

